<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="whiteGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <linearGradient id="goldAccentW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- Emblem Shield -->
  <g transform="translate(15, 10)">
    <!-- Base Shield -->
    <path d="M 45 5 L 85 24 L 85 68 C 85 92 45 106 45 106 C 45 106 5 92 5 68 L 5 24 Z" 
          fill="#FFFFFF" />
    
    <!-- Inner Border -->
    <path d="M 45 11 L 79 27 L 79 66 C 79 86 45 98 45 98 C 45 98 11 86 11 66 L 11 27 Z" 
          fill="none" stroke="#C8102E" stroke-width="2" stroke-opacity="0.9" />

    <!-- Stylized Bridge / Connection Wings -->
    <path d="M 22 55 Q 45 35 68 55 Q 45 45 22 55 Z" fill="#C8102E" />
    <path d="M 26 63 Q 45 47 64 63 Q 45 55 26 63 Z" fill="url(#goldAccentW)" />
    
    <!-- 5 Stars arc -->
    <circle cx="45" cy="26" r="3.5" fill="#C8102E" />
    <circle cx="33" cy="30" r="2.8" fill="#C8102E" />
    <circle cx="57" cy="30" r="2.8" fill="#C8102E" />
    <circle cx="23" cy="38" r="2.2" fill="#C8102E" />
    <circle cx="67" cy="38" r="2.2" fill="#C8102E" />

    <!-- Center Monogram CBA -->
    <text x="45" y="84" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
          font-size="16" font-weight="900" fill="#C8102E" text-anchor="middle" letter-spacing="1">CBA</text>
  </g>

  <!-- Wordmark Section -->
  <g transform="translate(125, 34)">
    <text x="0" y="0" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
          font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      CHINA BUSINESS ASSOCIATES
    </text>
    <text x="350" y="-1" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="13" font-weight="600" fill="#FCE588" letter-spacing="2">
      美中商务
    </text>

    <!-- Subtitle / Division -->
    <text x="0" y="24" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
          font-size="13" font-weight="700" fill="#FCE588" letter-spacing="2.5">
      AMERICA-CHINA.COM
    </text>

    <!-- Heritage Tag -->
    <text x="0" y="44" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" 
          font-size="10.5" font-weight="500" fill="#E5E7EB" letter-spacing="1">
      PIONEERING U.S.–CHINA TRADE, INVESTMENT &amp; TECHNOLOGY SINCE 1980
    </text>

    <!-- Divider Bar -->
    <rect x="0" y="52" width="375" height="2" fill="url(#goldAccentW)" rx="1" />
  </g>
</svg>
